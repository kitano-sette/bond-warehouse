function remainingYearsRaw(maturityDate) {
  if (!maturityDate) return null;
  const m = new Date(maturityDate + "T00:00:00");
  if (isNaN(m.getTime())) return null;
  const now = new Date();
  return (m.getTime() - now.getTime()) / (1000 * 60 * 60 * 24 * 365.25);
}

function remainingYearsDisplay(bond) {
  if (bond.perpetual) return "PERP";
  const y = remainingYearsRaw(bond.maturityDate);
  if (y === null) return "—";
  if (y < 0) return "ครบกำหนดแล้ว";
  return y.toFixed(2);
}

function fmtDateTH(d) {
  if (!d) return "—";
  const dt = new Date(d + "T00:00:00");
  if (isNaN(dt.getTime())) return d;
  return dt.toLocaleDateString("th-TH", { year: "numeric", month: "short", day: "2-digit" });
}

/* ----- comma-formatted number input (live, while typing & after) ----- */
function sanitizeRaw(input, allowDecimal) {
  let v = input.replace(/,/g, "");
  if (allowDecimal) {
    v = v.replace(/[^0-9.]/g, "");
    const parts = v.split(".");
    if (parts.length > 2) v = parts[0] + "." + parts.slice(1).join("");
    const [ip, dp] = v.split(".");
    if (dp !== undefined) v = ip + "." + dp.slice(0, 2);
  } else {
    v = v.replace(/[^0-9]/g, "");
  }
  return v;
}
function formatDisplay(raw) {
  if (raw === "" || raw === undefined || raw === null) return "";
  let [intPart, decPart] = String(raw).split(".");
  intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return decPart !== undefined ? intPart + "." + decPart : intPart;
}
function formatMillions(raw) {
  if (raw === "" || raw === undefined || raw === null || isNaN(Number(raw))) return "—";
  const millions = Number(raw) / 1000000;
  const [intPart, decPart] = millions.toFixed(2).split(".");
  return intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "." + decPart;
}
function formatPct(v) {
  if (v === "" || v === undefined || v === null || isNaN(Number(v))) return "—";
  return `${Number(v).toFixed(2)}%`;
}

      {children}
      {hint && <span style={{ display: "block", fontSize: 11, marginTop: 4, color: C.textMute }}>{hint}</span>}

}

const inputBase = {
  width: "100%",
  padding: "9px 12px",
  borderRadius: "8px",
  border: `1px solid ${C.border}`,
  fontFamily: "Sarabun, sans-serif",
  fontSize: "14px",
  color: C.text,
  background: "#fff",
};

function TInput(props) { return <input {...props} style={{ ...inputBase, ...(props.style || {}) }} />; }
function TSelect(props) { return <select {...props} style={{ ...inputBase, ...(props.style || {}) }} />; }
function TTextarea(props) { return <textarea {...props} style={{ ...inputBase, resize: "vertical", ...(props.style || {}) }} />; }

function NumberField({ value, onChange, allowDecimal = true, placeholder, style }) {
  const handle = (e) => onChange(sanitizeRaw(e.target.value, allowDecimal));
  return (
    <TInput
      inputMode="decimal"
      value={formatDisplay(value)}
      onChange={handle}
      placeholder={placeholder}
      style={style}
    />
  );
}

function PercentField({ value, onChange }) {
  const handleBlur = (e) => {
    if (e.target.value === "") return;
    const num = Number(e.target.value);
    if (!isNaN(num)) onChange(num.toFixed(2));
  };
  return (
    <TInput type="number" step="0.01" value={value} onChange={(e) => onChange(e.target.value)} onBlur={handleBlur} />
  );
}

function UnitField({ value, onChange, placeholder }) {
  return (
    <div style={{ position: "relative" }}>
      <NumberField value={value} onChange={onChange} allowDecimal={false} placeholder={placeholder} style={{ paddingRight: 52 }} />
      <span style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", fontSize: 12, color: C.textMute, pointerEvents: "none" }}>
        หน่วย
      </span>
    </div>
  );
}

function Button({ variant = "outline", children, style, ...rest }) {
  const base = {
    display: "inline-flex", alignItems: "center", gap: 6, padding: "9px 16px",
    borderRadius: 9, fontWeight: 600, fontSize: 14, cursor: "pointer",
    border: "1px solid transparent", transition: "opacity .15s ease, transform .1s ease",
  };
  const variants = {
    primary: { background: `linear-gradient(135deg, ${C.gold}, ${C.goldDeep})`, color: "#fff" },
    accent: { background: `linear-gradient(135deg, ${C.accentFrom}, ${C.accentTo})`, color: "#fff", boxShadow: "0 4px 14px rgba(255,107,74,0.35)" },
    dark: { background: C.brown, color: "#fff" },
    outline: { background: "#fff", color: C.brown, border: `1px solid ${C.border}` },
    danger: { background: "#fff", color: C.danger, border: `1px solid ${C.danger}55` },
    ghost: { background: "transparent", color: C.brownSoft },
  };
  return (
    <button {...rest} style={{ ...base, ...variants[variant], ...style }}
      onMouseDown={(e) => (e.currentTarget.style.transform = "scale(0.98)")}
      onMouseUp={(e) => (e.currentTarget.style.transform = "scale(1)")}>
      {children}
    </button>
  );
}

  );
}

          <div style={{ fontSize: 13, color: C.text, whiteSpace: "pre-wrap", marginBottom: 10 }}>{bond.comment}</div>
        </>
      )}

      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 14 }}>
        <Button variant="outline" onClick={() => onEdit(bond)}><IconPencil size={14} /> แก้ไข</Button>
        <Button variant="danger" onClick={() => onDeleteReq(bond)}><IconTrash size={14} /> ลบ</Button>
        {!closed ? (
          <Button variant="dark" onClick={() => onToggleStatus(bond, "closed")}><IconLock size={14} /> ปิดการขาย</Button>
        ) : (
          <Button variant="ghost" onClick={() => onToggleStatus(bond, "open")}>เปิดขายอีกครั้ง</Button>
        )}
      </div>
    </div>
  );
}

---------------------------------------------------------------- */
function ListView({ bonds, onEdit, onDeleteReq, onExport, exporting, onToggleStatus }) {
  const [q, setQ] = useState("");
  const [expandedId, setExpandedId] = useState(null);

  const filtered = useMemo(() => {
    const s = q.trim().toLowerCase();
    if (!s) return bonds;
    return bonds.filter((b) => [b.code, b.instrumentName, b.issuerName].some((v) => (v || "").toLowerCase().includes(s)));
  }, [bonds, q]);

  const cols = ["", "รหัสหุ้นกู้", "YTM ขาย (%)", "YTM รับซื้อ (%)", "ดอกเบี้ย (%)", "อายุคงเหลือ (ปี)", "เสนอขาย (ลบ.)"];

  const sorted = useMemo(() => {
    return [...filtered].sort((a, b) => {
      const aClosed = a.status === "closed" ? 1 : 0;
      const bClosed = b.status === "closed" ? 1 : 0;
      return aClosed - bClosed;
    });
  }, [filtered]);

  return (
    <div style={{ padding: 24 }}>
      <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", justifyContent: "space-between", gap: 12, marginBottom: 20 }}>
        <div style={{ position: "relative", width: 320, maxWidth: "100%" }}>
          <IconSearch size={16} style={{ position: "absolute", left: 12, top: 11, color: C.textMute }} />
          <TInput placeholder="ค้นหา รหัส / ชื่อตราสาร / ผู้ออก" value={q} onChange={(e) => setQ(e.target.value)} style={{ paddingLeft: 34 }} />
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <span style={{ fontSize: 12, color: C.textMute }}>ทั้งหมด {bonds.length} รายการ</span>
          <Button variant="dark" onClick={onExport} disabled={exporting}>
            {exporting ? <IconLoader size={16} /> : <IconDownload size={16} />} Export Excel
          </Button>
        </div>
      </div>

      {filtered.length === 0 ? (
        <div style={{ borderRadius: 16, padding: "64px 0", textAlign: "center", border: `1px dashed ${C.border}`, background: C.bgSoft }}>
          <div style={{ width: 56, height: 56, borderRadius: 999, margin: "0 auto 12px", display: "flex", alignItems: "center", justifyContent: "center", background: C.goldFaint }}>
            <IconSparkles size={22} color={C.gold} />
          </div>
          <p style={{ fontFamily: "Prompt, sans-serif", color: C.text, fontWeight: 600, margin: 0 }}>
            {bonds.length === 0 ? "ยังไม่มีหุ้นกู้ในคลังสินค้า" : "ไม่พบรายการที่ค้นหา"}
          </p>
          <p style={{ fontSize: 14, color: C.textMute, marginTop: 4 }}>
            {bonds.length === 0 ? "กดปุ่ม “เพิ่มหุ้นกู้” ที่มุมขวาบนเพื่อเริ่มกรอกข้อมูล" : "ลองค้นหาด้วยคำอื่น"}
          </p>
        </div>
      ) : (
        <div style={{ overflowX: "auto", borderRadius: 16, border: `1px solid ${C.border}` }}>
          <table style={{ width: "100%", fontSize: 14, borderCollapse: "collapse" }}>
            <thead>
              <tr style={{ background: C.goldFaint, color: C.brown }}>
                {cols.map((h, i) => (
                  <th key={i} style={{ textAlign: "left", padding: "12px 16px", fontWeight: 600, fontSize: 12, whiteSpace: "nowrap" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {sorted.map((b, idx) => {
                const open = expandedId === b.id;
                const closed = b.status === "closed";
                return (
                  <React.Fragment key={b.id}>
                    <tr
                      onClick={() => setExpandedId(open ? null : b.id)}
                      style={{
                        borderTop: `1px solid ${C.border}`,
                        background: closed ? "#fff" : b.highlight ? C.goldFaint : idx % 2 ? C.bgSoft : "#fff",
                        cursor: "pointer",
                        opacity: closed ? 0.45 : 1,
                      }}
                    >
                      <td style={{ padding: "0 4px 0 12px", width: 20 }}><IconChevron open={open} size={14} color={C.textMute} /></td>
                      <td style={{ padding: "12px 16px", fontWeight: 700, color: C.brown, whiteSpace: "nowrap" }}>
                        <span style={{
                          display: "inline-block", width: 7, height: 7, borderRadius: 999, marginRight: 6,
                          background: closed ? C.textMute : C.ok,
                        }} title={closed ? "ปิดการขายแล้ว" : "กำลังเสนอขาย"} />
                        {b.highlight && <IconStar filled size={12} color={C.gold} style={{ marginRight: 6, verticalAlign: "-1px" }} />}
                        {b.code || "—"}
                      </td>
                      <td style={{ padding: "12px 16px", whiteSpace: "nowrap" }}>{formatPct(b.ytmSell)}</td>
                      <td style={{ padding: "12px 16px", whiteSpace: "nowrap" }}>{formatPct(b.ytmBuy)}</td>
                      <td style={{ padding: "12px 16px", whiteSpace: "nowrap" }}>{formatPct(b.couponRate)}</td>
                      <td style={{ padding: "12px 16px", whiteSpace: "nowrap" }}>{remainingYearsDisplay(b)}</td>
                      <td style={{ padding: "12px 16px", whiteSpace: "nowrap" }}>{formatMillions(b.offerAmount)}</td>
                    </tr>
                    {open && (
                      <tr>
                        <td colSpan={cols.length} style={{ padding: 0 }}>
                          <ExpandedDetail bond={b} onEdit={onEdit} onDeleteReq={onDeleteReq} onToggleStatus={onToggleStatus} />
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function FormView({ initial, onSave, onCancel }) {
  const [bond, setBond] = useState(initial);

    setBond((b) => ({ ...b, perpetual: checked, maturityDate: checked ? "" : b.maturityDate }));
  };

  const updatePurchaseRow = (id, key, value) =>
    setBond((b) => ({ ...b, purchasedFrom: b.purchasedFrom.map((r) => (r.id === id ? { ...r, [key]: value } : r)) }));
  const addPurchaseRow = () => setBond((b) => ({ ...b, purchasedFrom: [...b.purchasedFrom, emptyPurchaseRow()] }));
  const removePurchaseRow = (id) => setBond((b) => ({ ...b, purchasedFrom: b.purchasedFrom.filter((r) => r.id !== id) }));

  const totalUnits = useMemo(
    () => (bond.purchasedFrom || []).reduce((sum, r) => sum + (Number(r.units) || 0), 0),
    [bond.purchasedFrom]
  );
  const computedOfferAmount = totalUnits * 1000;

  const canSave = bond.code.trim() && bond.instrumentName.trim();

          <PercentField value={bond.ytmSell} onChange={(v) => set("ytmSell", v)} />
        </Field>
        <Field label="YTM รับซื้อ (%)">
          <PercentField value={bond.ytmBuy} onChange={(v) => set("ytmBuy", v)} />
        </Field>
        <Field label="อันดับความน่าเชื่อถือ (บริษัท)">

        <Field label="อันดับความน่าเชื่อถือ (ตราสาร)">

        </Button>

      </div>
    </div>
  );

/* ---------------------------------------------------------------
   Root App
---------------------------------------------------------------- */
function BondWarehouseApp() {
  const [bonds, setBonds] = useState([]);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState("list");
  const [editing, setEditing] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [exporting, setExporting] = useState(false);
  const [saveError, setSaveError] = useState(false);

  const loadFromSupabase = useCallback(async () => {
    try {
      const { data, error } = await supabase
        .from(BONDS_TABLE)
        .select("*")
        .order("updated_at", { ascending: false });
      if (error) throw error;
      setBonds((data || []).map(rowToBond));
      setSaveError(false);
    } catch (e) {
      console.error(e);
      setSaveError(true);
    }
  }, []);

  useEffect(() => {
    if (!SUPABASE_CONFIGURED || !supabase) { setLoading(false); return; }

    loadFromSupabase().finally(() => setLoading(false));

    // Realtime: any insert/update/delete on the bonds table (from this
    // browser, a teammate's browser, or the Bond Screener page) refreshes
    // the list automatically — this is what keeps both files "in sync".
    const channel = supabase
      .channel("bonds-changes")
      .on("postgres_changes", { event: "*", schema: "public", table: BONDS_TABLE }, () => {
        loadFromSupabase();
      })
      .subscribe();

    return () => { supabase.removeChannel(channel); };
  }, [loadFromSupabase]);

  const handleSave = async (bond) => {
    try {
      const row = bondToRow(bond);
      const { error } = await supabase.from(BONDS_TABLE).upsert(row, { onConflict: "id" });
      if (error) throw error;
      setSaveError(false);
      await loadFromSupabase();
      setView("list");
      setEditing(null);
    } catch (e) {
      console.error(e);
      setSaveError(true);
    }
  };

  const handleDeleteConfirmed = async () => {
    if (!deleteTarget) return;
    try {
      const { error } = await supabase.from(BONDS_TABLE).delete().eq("id", deleteTarget.id);
      if (error) throw error;
      setSaveError(false);
      await loadFromSupabase();
    } catch (e) {
      console.error(e);
      setSaveError(true);
    }
    setDeleteTarget(null);
  };

  const handleToggleStatus = async (bond, status) => {
    try {
      const { error } = await supabase
        .from(BONDS_TABLE)
        .update({ status, updated_at: new Date().toISOString() })
        .eq("id", bond.id);
      if (error) throw error;
      setSaveError(false);
      await loadFromSupabase();
    } catch (e) {
      console.error(e);
      setSaveError(true);
    }
  };

  const handleExport = () => {
    setExporting(true);
    setTimeout(() => {
      const rows = bonds.map((b) => ({
        "รหัสหุ้นกู้ (Code)": b.code,
        "ชื่อตราสาร": b.instrumentName,
        "ชื่อบริษัทผู้ออก": b.issuerName,
        "YTM ขาย (%)": b.ytmSell,
        "YTM รับซื้อ (%)": b.ytmBuy,
        "อันดับความน่าเชื่อถือ (บริษัท)": b.ratingCompany,
        "อันดับความน่าเชื่อถือ (ตราสาร)": b.ratingInstrument,
        "ระดับความเสี่ยงของตราสาร": b.riskLevel,
        "อัตราดอกเบี้ยหน้าตั๋ว (%)": b.couponRate,
        "วันที่ออกตราสาร": b.issueDate,
        "วันครบกำหนด": b.perpetual ? "PERP" : b.maturityDate,
        "อายุคงเหลือ (ปี)": remainingYearsDisplay(b),
        "จำนวนที่เสนอขาย (บาท)": b.offerAmount ? Number(b.offerAmount) : "",
        "จำนวนซื้อขั้นต่ำ (บาท)": b.minPurchase ? Number(b.minPurchase) : "",
        "สิทธิ": b.rights,
        "ประเภทนักลงทุน": b.investorType,
        "Highlight": b.highlight ? "TRUE" : "FALSE",
        "สถานะ": b.status === "closed" ? "ปิดการขายแล้ว" : "กำลังเสนอขาย",
        "รับซื้อจาก": (b.purchasedFrom || []).filter((r) => r.name).map((r) => `${r.name} (${r.units || 0} หน่วย)`).join("; "),
        "Comment": b.comment,
      }));
      const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ "รหัสหุ้นกู้ (Code)": "" }]);
      ws["!cols"] = Object.keys(rows[0] || { a: 1 }).map(() => ({ wch: 22 }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "คลังสินค้าหุ้นกู้");
      const stamp = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, `คลังสินค้าหุ้นกู้_${stamp}.xlsx`);
      setExporting(false);
    }, 150);
  };

  if (!SUPABASE_CONFIGURED) {
    return (
      <div style={{ width: "100%", minHeight: "100vh", background: C.bgSoft, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
        <div style={{ maxWidth: 480, background: C.bg, border: `1px solid ${C.border}`, borderRadius: 16, padding: 32, textAlign: "center" }}>
          <IconAlert size={32} color={C.gold} style={{ marginBottom: 12 }} />
          <div style={{ fontFamily: "Prompt, sans-serif", fontWeight: 700, fontSize: 20, color: C.text, marginBottom: 8 }}>
            ยังไม่ได้ตั้งค่า Supabase
          </div>
          <div style={{ fontSize: 14, color: C.textMute, lineHeight: 1.7 }}>
            กรุณาเปิดไฟล์นี้ในโปรแกรมแก้ไขข้อความ แล้วแทนที่ค่า <code>SUPABASE_URL</code> และ{" "}
            <code>SUPABASE_ANON_KEY</code> ใกล้ด้านบนของไฟล์ ด้วย URL และ anon key จากโปรเจกต์ Supabase
            ของคุณ (ดูวิธีหาค่านี้ในคู่มือที่แนบมาให้) จากนั้นบันทึกไฟล์แล้วเปิดใหม่อีกครั้ง
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ width: "100%", minHeight: "100vh", background: C.bg }}>
      <Header view={view} onAdd={() => { setEditing(emptyBond()); setView("form"); }} onBack={() => setView("list")} />

      {saveError && (
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 24px", fontSize: 12, background: "#FCEFEF", color: C.danger }}>
          <IconAlert size={14} /> เชื่อมต่อฐานข้อมูล Supabase ไม่สำเร็จ กรุณาตรวจสอบ SUPABASE_URL / SUPABASE_ANON_KEY หรือการเชื่อมต่ออินเทอร์เน็ต
        </div>
      )}

      {loading ? (
        <div style={{ display: "flex", justifyContent: "center", padding: "96px 0" }}>
          <IconLoader size={22} color={C.gold} />
        </div>
      ) : view === "list" ? (
        <ListView bonds={bonds} onEdit={(b) => { setEditing(b); setView("form"); }} onDeleteReq={setDeleteTarget}
          onExport={handleExport} exporting={exporting} onToggleStatus={handleToggleStatus} />
      ) : (
        <FormView initial={editing} onSave={handleSave} onCancel={() => { setView("list"); setEditing(null); }} />
      )}

      <ConfirmDialog
        open={!!deleteTarget}
        title="ลบหุ้นกู้นี้ออกจากคลัง?"
        body={deleteTarget ? `รหัส "${deleteTarget.code}" — ${deleteTarget.instrumentName || ""}` : ""}
        confirmLabel="ลบข้อมูล"
        onCancel={() => setDeleteTarget(null)}
        onConfirm={handleDeleteConfirmed}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<BondWarehouseApp />);
</script>
</body>
</html>
